# Compile le mod Fabric « compagnon » (capteur d'état du jeu pour le compagnon IA) et dépose le .jar
# dans compagnon-minecraft/mod-pret/ pour qu'il soit dans le ZIP téléchargé par le joueur.
name: Mod compagnon (Fabric)

on:
  push:
    paths:
      - 'compagnon-minecraft/mod/**'
      - '.github/workflows/compagnon-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: compagnon-minecraft/mod
    steps:
      - uses: actions/checkout@v6
      - name: Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Compiler le mod
        run: gradle build --no-daemon --stacktrace
      - name: Garder le .jar comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: compagnon-capteur
          path: compagnon-minecraft/mod/build/libs/*.jar
      - name: Déposer le .jar dans le dépôt
        if: github.event_name == 'push'
        run: |
          mkdir -p ../mod-pret
          rm -f ../mod-pret/*.jar
          cp build/libs/compagnon-capteur-*.jar ../mod-pret/ 2>/dev/null || true
          rm -f ../mod-pret/*-sources.jar
          cd ..
          git config user.name "compagnon-bot"
          git config user.email "compagnon-bot@users.noreply.github.com"
          git add mod-pret
          git diff --cached --quiet || git commit -m "Mod compagnon : .jar compilé par GitHub Actions"
          git push origin HEAD:${{ github.ref_name }}
